<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart OCR & MinIO Dataset Labeling Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.3);
            --accent-cyan: #06b6d4;
            --accent-cyan-glow: rgba(6, 182, 212, 0.3);
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand { display: flex; align-items: center; gap: 0.75rem; }

        .brand-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 1.2rem;
            box-shadow: 0 0 15px var(--accent-cyan-glow);
        }

        .brand-title {
            font-size: 1.25rem; font-weight: 700; letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .header-actions { display: flex; gap: 1rem; align-items: center; }

        .btn-export {
            background: linear-gradient(135deg, var(--accent-green), #059669);
            color: #ffffff; border: none; padding: 0.6rem 1.2rem;
            border-radius: 10px; font-weight: 600; font-size: 0.85rem;
            cursor: pointer; display: flex; align-items: center; gap: 0.5rem;
            box-shadow: 0 0 15px var(--accent-green-glow); transition: all 0.2s ease;
        }

        .btn-export:hover { transform: translateY(-2px); box-shadow: 0 0 20px var(--accent-green-glow); }

        .container {
            display: grid; grid-template-columns: 340px 1fr;
            gap: 1.5rem; padding: 1.5rem 2rem; flex: 1;
            max-width: 1850px; margin: 0 auto; width: 100%;
        }

        .sidebar { display: flex; flex-direction: column; gap: 1.25rem; }

        .card {
            background: var(--panel-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--border-color); border-radius: 16px;
            padding: 1.25rem; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .card-title {
            font-size: 0.85rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.85rem;
            display: flex; align-items: center; gap: 0.5rem;
        }

        .sample-list { display: flex; flex-direction: column; gap: 0.5rem; max-height: 180px; overflow-y: auto; }

        .sample-btn {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-main); padding: 0.65rem 0.85rem; border-radius: 8px;
            cursor: pointer; text-align: left; font-size: 0.82rem;
            font-family: 'JetBrains Mono', monospace; transition: all 0.2s ease;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .sample-btn:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--accent-cyan); }
        .sample-btn.active {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(139, 92, 246, 0.2));
            border-color: var(--accent-cyan); box-shadow: 0 0 12px var(--accent-cyan-glow);
        }

        .dropzone {
            border: 2px dashed rgba(255, 255, 255, 0.15); border-radius: 12px;
            padding: 1.25rem 1rem; text-align: center; cursor: pointer; transition: all 0.2s ease;
        }

        .dropzone:hover { border-color: var(--accent-green); background: rgba(16, 185, 129, 0.05); }
        .dropzone p { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem; }

        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
        .stat-box { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: 12px; padding: 0.85rem; text-align: center; }
        .stat-value { font-size: 1.4rem; font-weight: 700; margin-top: 0.25rem; }
        .stat-value.green { color: var(--accent-green); }
        .stat-value.cyan { color: var(--accent-cyan); }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }

        .workspace { display: flex; flex-direction: column; gap: 1rem; }

        .tab-bar { display: flex; gap: 0.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
        .tab-btn {
            background: transparent; border: none; color: var(--text-muted);
            padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer;
            font-weight: 500; font-size: 0.9rem; transition: all 0.2s ease;
        }
        .tab-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.05); }
        .tab-btn.active { color: var(--text-main); background: rgba(255, 255, 255, 0.1); font-weight: 600; }

        .viewer-card {
            background: var(--panel-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--border-color); border-radius: 16px;
            padding: 1.25rem; display: flex; flex-direction: column; gap: 1.25rem;
        }

        .image-viewport {
            width: 100%; height: 480px; background: #020617; border-radius: 12px;
            overflow: auto; display: flex; align-items: center; justify-content: center;
            position: relative; border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .image-viewport img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .crops-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem; max-height: 540px; overflow-y: auto; padding: 0.5rem;
        }

        .crop-card {
            background: rgba(15, 23, 42, 0.85); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 0.85rem; display: flex; flex-direction: column;
            gap: 0.75rem; transition: all 0.2s ease; position: relative;
        }
        .crop-card:hover { border-color: var(--accent-cyan); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4); }

        .crop-header { display: flex; justify-content: space-between; align-items: center; }
        .crop-id { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); }

        .type-select {
            background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 0.2rem 0.4rem; border-radius: 6px;
            font-size: 0.7rem; font-weight: 600; cursor: pointer; outline: none;
        }
        .type-select.NUMBER { color: var(--accent-green); border-color: var(--accent-green); }
        .type-select.TEXT { color: var(--accent-cyan); border-color: var(--accent-cyan); }

        .crop-preview-box {
            height: 75px; background: #000; border-radius: 8px; display: flex;
            align-items: center; justify-content: center; overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05); padding: 4px;
        }
        .crop-preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; filter: contrast(1.1); }

        .label-input-group { display: flex; flex-direction: column; gap: 0.25rem; }
        .label-input-label { font-size: 0.68rem; color: var(--text-muted); }

        .crop-input {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main); padding: 0.5rem 0.75rem; border-radius: 8px;
            font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; font-weight: 600;
            outline: none; transition: all 0.2s ease;
        }
        .crop-input:focus { border-color: var(--accent-green); background: rgba(16, 185, 129, 0.05); box-shadow: 0 0 8px var(--accent-green-glow); }

        .save-indicator { position: absolute; top: 8px; right: 8px; font-size: 0.75rem; color: var(--accent-green); opacity: 0; transition: opacity 0.3s ease; }
        .save-indicator.active { opacity: 1; }

        .chart-selector {
            background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 0.5rem 1rem; border-radius: 8px;
            font-size: 0.85rem; font-family: 'JetBrains Mono', monospace; outline: none; width: 100%;
        }

        .loading-overlay {
            position: absolute; inset: 0; background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px); display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 1rem; z-index: 50;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent-cyan); border-radius: 50%; animation: spin 1s infinite linear;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon">📦</div>
            <div class="brand-title">Chart OCR & MinIO Dataset Labeling Studio</div>
        </div>
        <div class="header-actions">
            <button class="btn-export" onclick="exportTrainingZip()">
                📥 Export Training ZIP (Label Studio + Images)
            </button>
        </div>
    </header>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="card">
                <div class="card-title">🗄️ MinIO Datasets (ZIP Archives)</div>
                <div class="dropzone" id="zipDropzone" style="margin-bottom: 0.75rem;">
                    <div style="font-size: 1.25rem;">📦</div>
                    <p>Upload Dataset ZIP to MinIO</p>
                    <input type="file" id="zipFileInput" accept=".zip" style="display:none">
                </div>
                <div class="sample-list" id="minioDatasetList">
                    <!-- Populated by JS -->
                </div>
            </div>

            <div class="card">
                <div class="card-title">📁 Local Sample Charts</div>
                <div class="sample-list" id="sampleList"></div>
            </div>

            <div class="card">
                <div class="card-title">📊 Dataset Statistics</div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">Numbers</div>
                        <div class="stat-value green" id="statNumbers">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Labels</div>
                        <div class="stat-value cyan" id="statTexts">0</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Workspace -->
        <div class="workspace">
            <div class="viewer-card">
                <!-- Dataset Chart Selector -->
                <div id="datasetChartBar" style="display:none; flex-direction:column; gap:0.5rem;">
                    <div class="card-title" style="margin:0;">🖼️ Dataset Processed Charts</div>
                    <select class="chart-selector" id="datasetChartSelect" onchange="onDatasetChartChange(this.value)"></select>
                </div>

                <div class="tab-bar">
                    <button class="tab-btn active" onclick="switchView('crops')">✂️ Interactive Crops Gallery</button>
                    <button class="tab-btn" onclick="switchView('annotated')">🎯 Bounding Boxes Chart</button>
                    <button class="tab-btn" onclick="switchView('original')">🖼️ Original Chart</button>
                </div>

                <div class="image-viewport" id="viewport" style="display:none;">
                    <div class="loading-overlay" id="loadingOverlay" style="display:none;">
                        <div class="spinner"></div>
                        <div style="font-weight: 500;" id="loadingText">Processing dataset & running OCR...</div>
                    </div>
                    <img id="mainImage" src="" alt="Chart View">
                </div>

                <div id="cropsContainer">
                    <div class="card-title" style="margin-bottom: 0.75rem;">
                        ✏️ Crop Snippets (Edit prediction or Type dropdown to verify)
                    </div>
                    <div class="crops-grid" id="cropsGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentData = null;
        let currentDatasetName = null;
        let datasetCharts = [];
        let currentView = 'crops';

        document.addEventListener('DOMContentLoaded', () => {
            loadSamples();
            loadMinIODatasets();

            const zipDropzone = document.getElementById('zipDropzone');
            const zipFileInput = document.getElementById('zipFileInput');
            zipDropzone.addEventListener('click', () => zipFileInput.click());
            zipFileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) uploadZipToMinIO(e.target.files[0]);
            });
        });

        async function loadSamples() {
            const res = await fetch('/api/samples');
            const samples = await res.json();
            const listEl = document.getElementById('sampleList');
            listEl.innerHTML = '';

            samples.forEach((sample, idx) => {
                const btn = document.createElement('button');
                btn.className = 'sample-btn';
                btn.innerText = `📄 ${sample}`;
                btn.onclick = () => {
                    document.querySelectorAll('.sample-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentDatasetName = null;
                    document.getElementById('datasetChartBar').style.display = 'none';
                    processSample(sample);
                };
                listEl.appendChild(btn);
            });
        }

        async function loadMinIODatasets() {
            const res = await fetch('/api/minio/datasets');
            const datasets = await res.json();
            const listEl = document.getElementById('minioDatasetList');
            listEl.innerHTML = '';

            if (datasets.length === 0) {
                listEl.innerHTML = '<div style="font-size:0.75rem; color:var(--text-muted);">No ZIP datasets uploaded yet</div>';
                return;
            }

            datasets.forEach(ds => {
                const container = document.createElement('div');
                container.style.cssText = 'display:flex; gap:0.5rem; align-items:center;';
                
                const btn = document.createElement('button');
                btn.className = 'sample-btn';
                btn.style.flex = '1';
                btn.innerText = `📦 ${ds}`;
                btn.onclick = () => loadDatasetDetails(ds);
                
                const processBtn = document.createElement('button');
                processBtn.style.cssText = 'background:var(--accent-purple); color:#fff; border:none; padding:0.4rem 0.6rem; border-radius:6px; font-size:0.75rem; cursor:pointer; font-weight:600;';
                processBtn.innerText = '⚡ Process';
                processBtn.onclick = (e) => { e.stopPropagation(); processDatasetMinIO(ds); };
                
                container.appendChild(btn);
                container.appendChild(processBtn);
                listEl.appendChild(container);
            });
        }

        async function uploadZipToMinIO(file) {
            showLoading(true, "Uploading ZIP & extracting to MinIO S3...");
            const formData = new FormData();
            formData.append('file', file);
            try {
                const res = await fetch('/api/minio/upload_zip', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    alert(`Dataset '${data.dataset_name}' uploaded successfully with ${data.total_extracted} files!`);
                    loadMinIODatasets();
                    processDatasetMinIO(data.dataset_name);
                } else {
                    alert('Error: ' + data.error);
                }
            } catch(e) {
                alert('Error uploading ZIP to MinIO');
            } finally {
                showLoading(false);
            }
        }

        async function processDatasetMinIO(datasetName) {
            showLoading(true, `Processing all chart images in '${datasetName}' dataset with OCR...`);
            try {
                const res = await fetch('/api/minio/process_dataset', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({dataset_name: datasetName})
                });
                const data = await res.json();
                if (data.success) {
                    currentDatasetName = datasetName;
                    loadDatasetDetails(datasetName);
                }
            } catch(e) {
                alert('Error batch processing MinIO dataset');
            } finally {
                showLoading(false);
            }
        }

        async function loadDatasetDetails(datasetName) {
            currentDatasetName = datasetName;
            const res = await fetch(`/api/minio/dataset_details/${datasetName}`);
            const details = await res.json();
            datasetCharts = details.charts || [];
            
            const chartBar = document.getElementById('datasetChartBar');
            const selectEl = document.getElementById('datasetChartSelect');
            selectEl.innerHTML = '';

            if (datasetCharts.length === 0) {
                chartBar.style.display = 'none';
                alert(`Dataset '${datasetName}' has not been processed yet. Click '⚡ Process' button to start OCR.`);
                return;
            }

            chartBar.style.display = 'flex';
            datasetCharts.forEach((c, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = `📄 ${c.filename} (${c.number_count} numbers, ${c.text_count} text)`;
                selectEl.appendChild(opt);
            });

            currentData = datasetCharts[0];
            renderData();
        }

        function onDatasetChartChange(index) {
            currentData = datasetCharts[index];
            renderData();
        }

        async function processSample(filename) {
            showLoading(true, "Processing chart sample...");
            try {
                const res = await fetch('/api/process', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({filename: filename})
                });
                currentData = await res.json();
                renderData();
            } catch(e) {
                alert('Error processing image');
            } finally {
                showLoading(false);
            }
        }

        function renderData() {
            if (!currentData) return;

            document.getElementById('statNumbers').innerText = currentData.number_count;
            document.getElementById('statTexts').innerText = currentData.text_count;

            updateView();

            const grid = document.getElementById('cropsGrid');
            grid.innerHTML = '';

            currentData.detections.forEach(d => {
                const card = document.createElement('div');
                card.className = 'crop-card';
                card.innerHTML = `
                    <div class="save-indicator" id="save_${d.id}">✓ Saved</div>
                    <div class="crop-header">
                        <span class="crop-id">#${d.id}</span>
                        <select class="type-select ${d.type}" onchange="saveType(${d.id}, this.value, this)">
                            <option value="NUMBER" ${d.type === 'NUMBER' ? 'selected' : ''}>🔢 NUMBER</option>
                            <option value="TEXT" ${d.type === 'TEXT' ? 'selected' : ''}>🔤 TEXT</option>
                        </select>
                    </div>
                    <div class="crop-preview-box">
                        <img src="${d.crop_url}" alt="Crop ${d.id}">
                    </div>
                    <div class="label-input-group">
                        <div class="label-input-label">OCR Prediction (${(d.confidence*100).toFixed(0)}%)</div>
                        <input type="text" class="crop-input" value="${d.user_verified_text}" 
                               onchange="saveText(${d.id}, this.value)"
                               onkeydown="if(event.key==='Enter') this.blur();">
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function saveText(detectionId, newText) {
            if (!currentData) return;
            const endpoint = currentData.json_key ? '/api/minio/update_crop_label' : '/api/update_label';
            const body = currentData.json_key ? 
                { json_key: currentData.json_key, detection_id: detectionId, text: newText } :
                { base_name: currentData.base_name, detection_id: detectionId, text: newText };

            const res = await fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (data.success) {
                currentData = data.data;
                showSaved(detectionId);
            }
        }

        async function saveType(detectionId, newType, selectEl) {
            if (!currentData) return;
            selectEl.className = `type-select ${newType}`;
            const endpoint = currentData.json_key ? '/api/minio/update_crop_label' : '/api/update_label';
            const body = currentData.json_key ? 
                { json_key: currentData.json_key, detection_id: detectionId, type: newType } :
                { base_name: currentData.base_name, detection_id: detectionId, type: newType };

            const res = await fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (data.success) {
                currentData = data.data;
                showSaved(detectionId);
            }
        }

        function showSaved(id) {
            const indicator = document.getElementById(`save_${id}`);
            if (indicator) {
                indicator.classList.add('active');
                setTimeout(() => indicator.classList.remove('active'), 1200);
            }
            document.getElementById('statNumbers').innerText = currentData.number_count;
            document.getElementById('statTexts').innerText = currentData.text_count;
        }

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            updateView();
        }

        function updateView() {
            const viewport = document.getElementById('viewport');
            const cropsContainer = document.getElementById('cropsContainer');
            const img = document.getElementById('mainImage');

            if (currentView === 'crops') {
                viewport.style.display = 'none';
                cropsContainer.style.display = 'block';
            } else {
                cropsContainer.style.display = 'none';
                viewport.style.display = 'flex';
                if (currentView === 'annotated') img.src = currentData.annotated_url;
                else if (currentView === 'original') img.src = currentData.image_url;
            }
        }

        function exportTrainingZip() {
            if (currentDatasetName) {
                window.location.href = `/api/minio/export_training_zip/${currentDatasetName}`;
            } else if (currentData) {
                window.location.href = `/api/export_labelstudio/${currentData.base_name}`;
            } else {
                alert('Please select or process a dataset first.');
            }
        }

        function showLoading(show, text = "Processing dataset & running OCR...") {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }
    </script>
</body>
</html>
